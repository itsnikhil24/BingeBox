services:
  redis:
    image: redis:7-alpine
    container_name: bingebox-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile.api
    container_name: bingebox-api
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/.env
    depends_on:
      - redis

  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile.worker
    container_name: bingebox-worker
    env_file:
      - ./Backend/.env
    depends_on:
      - redis

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: bingebox-frontend
    ports:
      - "80:80"
    depends_on:
      - api